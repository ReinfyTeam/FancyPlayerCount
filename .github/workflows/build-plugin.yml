name: Build and validate FancyPlayerCount plugin

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: AxolotlBucketLabs/DevTools/.github/workflows/build-plugin.yml@v3
    with:
      axolotl-ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1
      php-version: '8.4'
      pm-version-major: '5'
      prepare-dependencies: true
      phpstan: max
