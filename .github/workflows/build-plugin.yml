name: Build and validate FancyPlayerCount plugin

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@628368d9476762bd23a194120b4a9a9d5ee299a1
    with:
      axolotl-ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
      php-version: '8.2'
      pm-version-major: '5'
      prepare-dependencies: true
      phpstan: max
      retention-days: 14
