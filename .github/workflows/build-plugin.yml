name: Build and validate FancyPlayerCount plugin

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@b3a02f924b4dafea627deec28e5af3d5462bf5a0
    with:
      axolotl-ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
      php-version: '8.2'
      pm-version-major: '5'
      prepare-dependencies: true
      phpstan: max
      retention-days: 14
